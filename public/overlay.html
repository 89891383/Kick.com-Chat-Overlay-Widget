<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kick Chat Overlay</title>
<script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ── OVERLAY MODE (no config UI) ── */
  html.overlay-mode, html.overlay-mode body {
    overflow: hidden; height: 100vh; background: transparent;
  }

  /* ── CONFIG MODE ── */
  html.config-mode { height: 100%; }
  html.config-mode body {
    height: 100%; background: #0a0a0f; color: #e2e2e8;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    display: flex; overflow: hidden;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 420px; min-width: 420px; max-width: 420px;
    height: 100vh; background: #101015;
    border-right: 1px solid rgba(255,255,255,0.06);
    display: flex; flex-direction: column;
  }

  /* Sidebar header (sticky at top) */
  #sidebar-header {
    padding: 20px 22px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    flex: 0 0 auto;
  }
  #sidebar-header h1 {
    font-size: 18px; font-weight: 800; letter-spacing: -0.02em;
    color: #fff; display: flex; align-items: center; gap: 8px;
  }
  #sidebar-header h1::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: #53FC18; box-shadow: 0 0 10px rgba(83,252,24,0.6);
  }
  #sidebar-header .subtitle { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 4px; }

  /* Tab bar */
  #tab-bar {
    display: flex; padding: 0 12px; gap: 2px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    background: #0d0d12; flex: 0 0 auto; overflow-x: auto;
    scrollbar-width: none;
  }
  #tab-bar::-webkit-scrollbar { display: none; }
  .tab-btn {
    background: none; border: none; color: rgba(255,255,255,0.4);
    padding: 12px 12px; font-size: 12px; font-weight: 600;
    font-family: inherit; cursor: pointer; white-space: nowrap;
    border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s;
    letter-spacing: 0.02em;
  }
  .tab-btn:hover { color: rgba(255,255,255,0.75); }
  .tab-btn.active { color: #fff; border-bottom-color: #53FC18; }

  /* Tab panels */
  #tab-content {
    flex: 1; overflow-y: auto; padding: 20px 22px 24px;
    display: flex; flex-direction: column; gap: 18px;
  }
  #tab-content::-webkit-scrollbar { width: 8px; }
  #tab-content::-webkit-scrollbar-track { background: transparent; }
  #tab-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
  #tab-content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }
  .tab-panel { display: none; flex-direction: column; gap: 18px; }
  .tab-panel.active { display: flex; }

  /* URL footer (sticky at bottom) */
  #sidebar-footer {
    padding: 14px 22px 18px;
    border-top: 1px solid rgba(255,255,255,0.05);
    background: #0d0d12; flex: 0 0 auto;
  }

  /* ── Form primitives ── */
  .cfg-group { display: flex; flex-direction: column; gap: 6px; }
  .cfg-group label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: rgba(255,255,255,0.45);
  }
  .cfg-group .hint { font-size: 11px; color: rgba(255,255,255,0.35); font-weight: 400; text-transform: none; letter-spacing: 0; }

  .cfg-group input[type="text"],
  .cfg-group input[type="number"],
  .cfg-group select {
    background: #17171f; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; padding: 9px 11px; color: #fff;
    font-size: 13px; font-family: inherit; outline: none;
    transition: border-color 0.15s, background 0.15s;
    width: 100%;
  }
  .cfg-group input:hover, .cfg-group select:hover { background: #1c1c26; }
  .cfg-group input:focus, .cfg-group select:focus {
    border-color: #53FC18; background: #17171f;
  }

  .cfg-row { display: flex; gap: 8px; }
  .cfg-row > * { flex: 1; min-width: 0; }

  /* Section titles inside a panel */
  .section-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; color: rgba(255,255,255,0.35);
    padding-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.05);
    margin-top: 6px;
  }
  .section-title:first-child { margin-top: 0; }

  /* Pill selector */
  .pill-group {
    display: flex; border-radius: 8px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08); background: #17171f;
  }
  .pill-group button {
    flex: 1; padding: 8px 4px; font-size: 12px; font-weight: 600;
    background: transparent; color: rgba(255,255,255,0.55); border: none;
    cursor: pointer; font-family: inherit; transition: all 0.15s;
    min-width: 0;
  }
  .pill-group button.active { background: #53FC18; color: #000; }
  .pill-group button:hover:not(.active) { background: rgba(255,255,255,0.05); color: #fff; }

  /* Toggle */
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 0; gap: 12px;
  }
  .toggle-row span { font-size: 13px; color: rgba(255,255,255,0.8); }
  .toggle {
    width: 38px; height: 22px; border-radius: 11px;
    background: #23232f; cursor: pointer; position: relative;
    transition: background 0.2s; border: none; padding: 0; flex: 0 0 auto;
  }
  .toggle::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #555; transition: all 0.2s;
  }
  .toggle.on { background: #53FC18; }
  .toggle.on::after { left: 19px; background: #000; }

  /* Slider (range) */
  .slider-row { display: flex; align-items: center; gap: 10px; }
  .slider-row input[type="range"] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 4px; background: #23232f; border-radius: 2px; outline: none;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: #53FC18; cursor: pointer; border: none;
  }
  .slider-row input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: #53FC18; cursor: pointer; border: none;
  }
  .slider-row .slider-val {
    min-width: 42px; text-align: right;
    font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.75);
    font-variant-numeric: tabular-nums;
  }

  /* Color row */
  .color-row { display: flex; gap: 8px; align-items: center; }
  .color-row input[type="color"] {
    width: 40px; height: 36px; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; background: #17171f; cursor: pointer; padding: 3px;
    flex: 0 0 auto;
  }
  .color-row input[type="text"] { flex: 1; }

  /* URL bar + copy */
  #url-bar {
    background: #17171f; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 8px 10px; display: flex; align-items: center; gap: 8px;
  }
  #url-bar input {
    flex: 1; background: none; border: none; color: #8888aa;
    font-size: 11px; font-family: 'Roboto Mono', monospace; outline: none;
    overflow: hidden; text-overflow: ellipsis; padding: 4px 0;
    min-width: 0;
  }
  #copy-btn {
    background: #53FC18; color: #000; border: none; border-radius: 6px;
    padding: 6px 12px; font-size: 11px; font-weight: 700; cursor: pointer;
    font-family: inherit; white-space: nowrap; transition: opacity 0.15s;
  }
  #copy-btn:hover { opacity: 0.85; }

  /* Connect button */
  #connect-btn {
    background: #53FC18; color: #000; border: none; border-radius: 10px;
    padding: 11px; font-size: 13px; font-weight: 800; cursor: pointer;
    font-family: inherit; transition: opacity 0.15s; width: 100%;
    letter-spacing: 0.02em;
  }
  #connect-btn:hover { opacity: 0.88; }
  #connect-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  #status-text {
    font-size: 11px; color: rgba(255,255,255,0.45);
    text-align: center; min-height: 14px; margin-top: 6px;
  }

  /* ── Preview area (right side) ── */
  #preview-area {
    flex: 1; min-width: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 32px; overflow: hidden;
    background: #0a0a0f;
  }
  #preview-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.14em; color: rgba(255,255,255,0.3);
    margin-bottom: 12px;
  }
  #preview-frame {
    width: 100%; max-width: 640px; height: 100%; max-height: 560px;
    position: relative; overflow: hidden;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.06);
    background-image:
      linear-gradient(45deg, #1a1a22 25%, transparent 25%),
      linear-gradient(-45deg, #1a1a22 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1a1a22 75%),
      linear-gradient(-45deg, transparent 75%, #1a1a22 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    background-color: #111118;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  #preview-frame.has-bg { background-image: none; }
  #preview-meta {
    font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.25);
    margin-top: 10px; letter-spacing: 0.06em;
  }

  /* Chat container — shared between modes */
  html.overlay-mode #chat_container,
  #preview-frame #chat_container {
    width: 100%; padding: 0;
    position: absolute; bottom: 0; left: 0; overflow: hidden;
    background: transparent; word-break: break-word;
  }

  .msg-row {
    margin: 0; display: grid; grid-template-rows: 1fr;
    opacity: 1; transform: translate3d(0,0,0);
    transition: grid-template-rows 220ms cubic-bezier(0.4,0,0.2,1),
                opacity 220ms cubic-bezier(0.4,0,0.2,1),
                transform 220ms cubic-bezier(0.4,0,0.2,1);
  }
  .msg-row.fading { grid-template-rows: 0fr; opacity: 0; transform: translate3d(0,-6px,0); }
  .msg-row-inner { min-height: 0; overflow: hidden; }

  @keyframes slideIn {
    from { opacity: 0; transform: translate3d(40px,0,0); }
    to   { opacity: 1; transform: translate3d(0,0,0); }
  }
  .msg-slide-in { animation: slideIn 250ms ease-out; }

  .badge-wrap { display: inline-flex; align-items: center; vertical-align: middle; line-height: 0; }
  .badge-wrap img { vertical-align: middle; border-radius: 10%; display: block; flex: 0 0 auto; }
  .msg-body { display: inline; }
  .msg-body img.emote { object-fit: contain; vertical-align: middle; display: inline-block; }
  .reply-preview { opacity: 0.68; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .source-icon { display: inline-flex; vertical-align: -0.1em; margin-right: 0.4em; }
  .source-dot { display: inline-block; border-radius: 9999px; margin-right: 0.4em; vertical-align: middle; }

  @media (max-width: 900px) {
    html.config-mode body { flex-direction: column; }
    #sidebar { width: 100%; min-width: 0; max-width: 100%; height: 55vh; }
    #preview-area { min-height: 45vh; padding: 16px; }
    #preview-frame { max-height: none; }
  }
</style>

function readableColor(hex) {
  const m=/^#?([0-9a-fA-F]{6})$/i.exec((hex||'').trim()); if(!m) return hex||'#ffffff';
  const n=parseInt(m[1],16),r=n>>16&255,g=n>>8&255,b=n&255;
  if((r*299+g*587+b*114)/1000>50) return hex;
  const rf=r/255,gf=g/255,bf=b/255,max=Math.max(rf,gf,bf),min=Math.min(rf,gf,bf);
  let h=0,s=0,l=(max+min)/2; const d=max-min;
  if(d){s=l>0.5?d/(2-max-min):d/(max+min);if(max===rf)h=((gf-bf)/d+(gf<bf?6:0))/6;else if(max===gf)h=((bf-rf)/d+2)/6;else h=((rf-gf)/d+4)/6;}

    c.style.fontFamily = ff;
    c.style.fontSize = this.sz.fontSize;
    c.style.textTransform = this.cfg.msgCaps ? 'uppercase' : '';
    c.style.textShadow = getStroke(this.cfg.stroke) || '';
    // Preload nick font too (if custom) — same loader (idempotent link injection)
    if (this.cfg.nickFont || this.cfg.nickGoogleFont) {
      loadGoogleFont(this.cfg.nickFont, this.cfg.nickGoogleFont);
    }
  }
  get nickFontFamily() {
    if (this.cfg.nickGoogleFont || this.cfg.nickFont) {
      return loadGoogleFont(this.cfg.nickFont, this.cfg.nickGoogleFont);
    }
    return null; // inherit from container
  }

  updateConfig(cfg) {
    this.cfg = cfg;
    this.applyStyles();
  }

  renderSourceTag() {
    const st = this.cfg.sourceTag;
    if (st==='dot') return `<span class="source-dot" style="width:0.5em;height:0.5em;background-color:#53FC18"></span>`;
    if (st==='icon') return `<span class="source-icon"><span style="width:1em;height:1em;display:inline-flex;align-items:center;justify-content:center">${KICK_ICON_SVG}</span></span>`;
    if (st==='label') return `<span style="font-size:0.72em;font-weight:700;color:#53FC18;background:rgba(83,252,24,0.16);padding:0.12em 0.4em;border-radius:0.4em;margin-right:0.4em;vertical-align:middle">Kick</span>`;
    return '';
  }

  renderTextWith7TV(text) {
    if (!this.emoteMap.size) return escapeHtml(text);
    return text.split(' ').map(w => {
      const url = this.emoteMap.get(w);
      return url ? `<img class="emote" src="${escapeHtml(url)}" alt="${escapeHtml(w)}" style="max-width:${this.emoteW};max-height:${this.emoteH};height:${this.emoteH};width:auto;margin-right:${this.sz.emoteMR}" loading="lazy">` : escapeHtml(w);
    }).join(' ');
  }

  renderBody(text, nativeEmotes) {
    if (!nativeEmotes.length) return this.renderTextWith7TV(text);
    const chars=[...text]; const sorted=[...nativeEmotes].sort((a,b)=>a.begin-b.begin);
    const parts=[]; let cursor=0;
    for (const e of sorted) {
      if (e.begin>cursor) parts.push(this.renderTextWith7TV(chars.slice(cursor,e.begin).join('')));
      parts.push(`<img class="emote" src="${escapeHtml(e.url)}" alt="${escapeHtml(e.text)}" style="max-width:${this.emoteW};max-height:${this.emoteH};height:${this.emoteH};width:auto;margin-right:${this.sz.emoteMR}" loading="lazy">`);
      cursor=e.end;
    }
    if (cursor<chars.length) parts.push(this.renderTextWith7TV(chars.slice(cursor).join('')));
    return parts.join('');
  }

  renderBadges(rawMsg) {
    const identity = rawMsg?.sender?.identity || {};
    const badges = [];
    const bStyle = s => `width:${s};height:${s};min-width:${s};min-height:${s};max-width:${s};max-height:${s};margin:0;vertical-align:middle;border-radius:10%;display:block;flex:0 0 auto`;
    const push = (src, alt) => badges.push(`<img src="${src}" alt="${escapeHtml(alt||'')}" style="${bStyle(this.sz.badgeS)}" loading="lazy" onerror="this.style.display='none'">`);

    for (const b of (identity.badges||[])) {
      if (!b||!b.type) continue;
      const url = KICK_BADGE_URLS[b.type];
      if (url) { push(url, b.type); continue; }
      if (b.type === 'subscriber') {
        // Match highest-months subscriber tier this user qualifies for (channel-custom art)
        const months = Number(b.count ?? 0);
        const match = (this.subscriberBadges||[]).find(sb => months >= sb.months);
        push(match?.badge_image?.src || KICK_BADGE_URLS.subscriber, 'subscriber');
        continue;
      }
      if (b.type === 'sub_gifter') {
        const count = Number(b.count ?? 0);
        const key = kickGifterKey(count);
        const url2 = KICK_GIFT_BADGE_URLS[key];
        if (url2) push(url2, 'gifter');
        continue;
      }
    }
    for (const b of (identity.badges_v2||[])) {
      if (!b?.image_url) continue;
      push(b.image_url, b.name||'badge');
    }
    if (!badges.length) return '';
    return `<span class="badge-wrap" style="gap:${this.sz.badgeGap};margin-right:${this.sz.badgeMR}">${badges.join('')}</span>`;
  }

  createMsgElement(rawMsg, isSystem, category) {
    const sender = rawMsg?.sender||{};
    const username = sender.username||sender.slug||'';
    const contentStr = typeof rawMsg.content==='string'?rawMsg.content:'';

    // Filters
    const uLow = username.toLowerCase();
    if (this.cfg.userBL.includes(uLow)||this.cfg.botNames.includes(uLow)) return null;
    const cLow = contentStr.toLowerCase();
    if (this.cfg.prefixBL.some(p=>cLow.startsWith(p))) return null;

    const {text,emotes} = parseKickEmotes(contentStr);
    const color = readableColor(sender.identity?.color||fallbackColor(username));
    const msgShadow = getMsgShadow(this.cfg.textShadow);

    const row = document.createElement('div');
    row.className = 'msg-row'+(this.cfg.msgSlideIn?' msg-slide-in':'');
    if (msgShadow) row.style.filter = msgShadow;

    const inner = document.createElement('div');
    inner.className = 'msg-row-inner';

    if (isSystem) {
      const icon = CATEGORY_ICON[category]||'📣';
      inner.innerHTML = `<div style="line-height:${this.sz.lineHeight};word-break:break-word;display:flex;align-items:flex-start;gap:0.3em">
        ${this.renderSourceTag()}
        <div style="border-left:2px solid #53FC18;background:linear-gradient(90deg,rgba(83,252,24,0.2),transparent);padding:0 8px;border-radius:6px;flex:1;min-width:0">
          <span style="margin-right:0.35em">${icon}</span><span style="font-weight:400" class="msg-body">${escapeHtml(text)}</span>
        </div></div>`;
    } else {
      let replyHTML = '';
      const meta = rawMsg.type==='reply'?rawMsg.metadata:null;
      if (meta?.original_sender&&meta?.original_message) {
        const rUser = meta.original_sender.username||'Unknown';
        const rText = parseKickEmotes(typeof meta.original_message.content==='string'?meta.original_message.content:'').text;
        replyHTML = `<div class="reply-preview" style="font-size:0.6em;line-height:1.35;margin-left:0.35em;padding-left:0.45em;border-left:2px solid rgba(255,255,255,0.28)"><span>↪ </span><strong>${escapeHtml(rUser)}</strong>${rText?' '+escapeHtml(rText):''}</div>`;
      }
      const nickFam = this.nickFontFamily;
      const nickStyle = `color:${color};font-weight:${this.cfg.nickWeight||800}` + (nickFam ? `;font-family:${nickFam}` : '');
      const nameBlock = this.cfg.hideNames?'':`<span style="display:inline">${this.renderBadges(rawMsg)}<span style="${nickStyle}">${escapeHtml(username)}</span><span style="margin-right:${this.sz.colonMR}">:</span></span>`;
      inner.innerHTML = `${replyHTML}<div style="line-height:${this.sz.lineHeight};word-break:break-word">${this.renderSourceTag()}${nameBlock}<span class="msg-body">${this.renderBody(text,emotes)}</span></div>`;
    }
    row.appendChild(inner);
    return row;
  }

  addMessage(rawMsg, isSystem, category) {
    const id = rawMsg.id?.toString();
    if (id && this.messageIds.has(id)) return;
    if (id) this.messageIds.add(id);
    const el = this.createMsgElement(rawMsg, isSystem, category);
    if (!el) return;
    if (id) el.dataset.msgId = id;
    el.dataset.senderId = rawMsg?.sender?.id?.toString()||'';
    this.container.appendChild(el);
    this.messageCount++;
    this.container.scrollTop = this.container.scrollHeight;
    while (this.messageCount > 80) {
      const f = this.container.firstElementChild; if(!f)break;
      const fid=f.dataset.msgId; if(fid)this.messageIds.delete(fid);
      this.container.removeChild(f); this.messageCount--;
    }
    if (this.cfg.fadeEnabled && this.cfg.fadeSeconds > 0 && id) {
      setTimeout(()=>{
        const m=this.container.querySelector(`[data-msg-id="${CSS.escape(id)}"]`);
        if(m){m.classList.add('fading');setTimeout(()=>{if(m.parentNode){this.container.removeChild(m);this.messageIds.delete(id);this.messageCount--;}},250);}
      }, this.cfg.fadeSeconds*1000);
    }
  }

  deleteMessage(id) {
    if(!id)return; const el=this.container.querySelector(`[data-msg-id="${CSS.escape(id.toString())}"]`);
    if(el){el.classList.add('fading');setTimeout(()=>{if(el.parentNode){this.container.removeChild(el);this.messageCount--;}this.messageIds.delete(id.toString());},250);}
  }
  deleteByUser(senderId) {
    const rem=[]; for(const c of this.container.children){if(senderId&&c.dataset.senderId===senderId.toString())rem.push(c);}
    for(const el of rem){el.classList.add('fading');const id=el.dataset.msgId;setTimeout(()=>{if(el.parentNode){this.container.removeChild(el);this.messageCount--;}if(id)this.messageIds.delete(id);},250);}
  }
  clearAll() { this.container.innerHTML=''; this.messageIds.clear(); this.messageCount=0; }

  async load7TV(kickUserId) {
    this.emoteMap = new Map();
    try {
      const gRes=await fetch('https://7tv.io/v3/emote-sets/global');
      if(gRes.ok){const d=await gRes.json();for(const e of(d.emotes||[]))if(e?.name&&e?.id)this.emoteMap.set(e.name,`https://cdn.7tv.app/emote/${e.id}/4x.webp`);}
    }catch{}
    try {
      const cRes=await fetch(`https://7tv.io/v3/users/kick/${kickUserId}`);
      if(cRes.ok){
        const cData=await cRes.json();
        let emotes=(cData?.emote_set?.emotes||[]).filter(e=>e?.name&&e?.id);
        if(!emotes.length){
          const setId=cData?.emote_set_id||cData?.emote_set?.id;
          if(setId){try{const s=await fetch(`https://7tv.io/v3/emote-sets/${setId}`);if(s.ok){const d=await s.json();emotes=(d.emotes||[]).filter(e=>e?.name&&e?.id);}}catch{}}
        }
        for(const e of emotes)this.emoteMap.set(e.name,`https://cdn.7tv.app/emote/${e.id}/4x.webp`);
      }
    }catch{}
  }

  async connectToKick(channel, onStatus) {
    if(this.pusher){this.pusher.disconnect();this.pusher=null;}
    this.clearAll();
    onStatus?.('connecting');
    let channelData=null;
    try{
      const res=await fetch(`https://kick.com/api/v2/channels/${encodeURIComponent(channel)}`,{headers:{Accept:'application/json'},cache:'no-store'});
      if(res.ok) channelData=await res.json();
    }catch{}
    if(!channelData?.chatroom?.id){onStatus?.('error',`Nie znaleziono kanału: ${channel}`);return;}
    const chatroomId=channelData.chatroom.id;
    const kickUserId=channelData.user_id||channelData.user?.id;
    // Store subscriber badges (custom per-channel art) sorted high→low months
    this.subscriberBadges = Array.isArray(channelData.subscriber_badges)
      ? [...channelData.subscriber_badges].sort((a,b)=>b.months-a.months) : [];
    onStatus?.('loading-emotes');
    if(kickUserId) await this.load7TV(kickUserId);
    onStatus?.('connected');

    this.pusher = new Pusher('34bf7a0ff419a2a775b9',{cluster:'us2',disableStats:true,activityTimeout:20000,pongTimeout:8000});
    const chat=this.pusher.subscribe(`chatrooms.${chatroomId}.v2`);
    chat.bind('App\\Events\\ChatMessageEvent',d=>{this.addMessage(decode(d),false);});
    chat.bind('App\\Events\\MessageDeletedEvent',d=>{const dd=decode(d);this.deleteMessage(dd.message?.id||dd.message_id);});
    chat.bind('App\\Events\\UserBannedEvent',d=>{const dd=decode(d);this.deleteByUser(dd.user?.id);});
    chat.bind('App\\Events\\ChatroomClearEvent',()=>this.clearAll());
    if(this.cfg.showSystemMsgs){
      chat.bind('App\\Events\\SubscriptionEvent',d=>{const dd=decode(d);const u=dd.username||'';this.addMessage({id:`sys-${Date.now()}-${Math.random().toString(36).slice(2)}`,content:`${u} subscribed!${(dd.months||0)>1?` (${dd.months} months)`:''}`,sender:{username:u,identity:{}}},true,'subscription');});
      chat.bind('App\\Events\\GiftedSubscriptionsEvent',d=>{const dd=decode(d);const c=Array.isArray(dd.gifted_usernames)?dd.gifted_usernames.length:Number(dd.count||1);const u=dd.gifter_username||'';this.addMessage({id:`sys-${Date.now()}-${Math.random().toString(36).slice(2)}`,content:`${u} gifted ${c} sub${c===1?'':'s'}!`,sender:{username:u,identity:{}}},true,'gift');});
    }
    this.pusher.connection.bind('state_change',s=>{if(s.current==='disconnected')setTimeout(()=>this.pusher?.connect(),2000);});
    this._watchdog=setInterval(()=>{const s=this.pusher?.connection.state;if(s==='unavailable'||s==='failed'){this.pusher?.disconnect();setTimeout(()=>this.pusher?.connect(),2000);}},10000);
  }

  disconnect() {
    if(this._watchdog)clearInterval(this._watchdog);
    this.pusher?.disconnect(); this.pusher=null;
  }
}

          <label>Source Tag <span class="hint">— znacznik przy nicku</span></label>
          <div class="pill-group" id="cfg-sourceTag">
            <button data-val="none" class="active">Brak</button>
            <button data-val="dot">Kropka</button>
            <button data-val="icon">Ikona</button>
            <button data-val="label">Label</button>
          </div>
        </div>

        <div class="toggle-row"><span>Slide-in animacja</span><button class="toggle" id="cfg-msgSlideIn"></button></div>
        <div class="toggle-row"><span>Wiadomości systemowe</span><button class="toggle on" id="cfg-showSystem"></button></div>
      </div>

      <!-- ── TAB: FILTRY ── -->
      <div class="tab-panel" data-tab="filters">
        <div class="cfg-group">
          <label>Blacklist userów <span class="hint">(po przecinku)</span></label>
          <input type="text" id="cfg-userBL" placeholder="user1, user2...">
        </div>
        <div class="cfg-group">
          <label>Blacklist botów <span class="hint">(po przecinku)</span></label>
          <input type="text" id="cfg-botNames" placeholder="nightbot, streamelements...">
        </div>
        <div class="cfg-group">
          <label>Blacklist prefiksów <span class="hint">— ukryj komendy zaczynające się od...</span></label>
          <input type="text" id="cfg-prefixBL" placeholder="!, ?, /...">
        </div>
      </div>

    </div>

    <div id="sidebar-footer">
      <div class="cfg-group">
        <label>Link do overlay <span class="hint">— wklej w OBS → Browser Source</span></label>
        <div id="url-bar">
          <input type="text" id="url-output" readonly>
          <button id="copy-btn">Kopiuj</button>
        </div>
      </div>
    </div>

  </div>

  <div id="preview-area">
    <div id="preview-label">Podgląd na żywo</div>
    <div id="preview-frame">
      <div id="chat_container"></div>
    </div>
    <div id="preview-meta">Szachownica = przezroczystość w OBS</div>
  </div>`;

  /* ── State ── */
  const state = {
    channel: '',
    font: 'opensans',
    googleFont: '',
    nickFont: '',
    nickGoogleFont: '',
    nickWeight: 800,
    msgWeight: 400,
    textSize: 'small',
    fontSize: '',
    textShadow: 'large',
    stroke: 'none',
    sourceTag: 'none',
    fontColor: '',
    bgColor: '',
    msgCaps: false,
    hideNames: false,
    msgSlideIn: false,
    showSystemMsgs: true,
    fadeSeconds: 0,
    fadeEnabled: false,
    emoteScale: 1,
    userBL: [],
    prefixBL: [],
    botNames: [],
  };

  const container = document.getElementById('chat_container');
  const engine = new ChatEngine(container, state);

  /* ── UI Bindings ── */
  const $ = id => document.getElementById(id);

  // Pill groups
  document.querySelectorAll('.pill-group').forEach(group => {
    group.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        group.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const key = group.id.replace('cfg-','');
        state[key] = btn.dataset.val;
        engine.updateConfig(state);
        updateURL();
      });
    });
  });

  // Tab switching
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.dataset.tab === target));
    });
  });

  // Toggles
  document.querySelectorAll('.toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.classList.toggle('on');
      const map = {
        'cfg-msgCaps':'msgCaps',
        'cfg-hideNames':'hideNames','cfg-msgSlideIn':'msgSlideIn',
        'cfg-showSystem':'showSystemMsgs',
      };
      const key = map[btn.id];
      if (key) { state[key] = btn.classList.contains('on'); engine.updateConfig(state); updateURL(); }
    });
  });

  // Font size px
  $('cfg-fontSize').addEventListener('input', e => { state.fontSize = e.target.value; engine.updateConfig(state); updateURL(); });

  // Font selects
  $('cfg-font').addEventListener('change', e => { state.font = e.target.value; engine.updateConfig(state); updateURL(); });
  $('cfg-nickFont').addEventListener('change', e => { state.nickFont = e.target.value; engine.updateConfig(state); updateURL(); });
  $('cfg-nickGoogleFont').addEventListener('input', e => { state.nickGoogleFont = e.target.value.trim(); engine.updateConfig(state); updateURL(); });
  $('cfg-textShadow').addEventListener('change', e => { state.textShadow = e.target.value; engine.updateConfig(state); updateURL(); });
  $('cfg-stroke').addEventListener('change', e => { state.stroke = e.target.value; engine.updateConfig(state); updateURL(); });

  // Weight sliders
  $('cfg-msgWeight').addEventListener('input', e => {
    state.msgWeight = parseInt(e.target.value,10)||400;
    $('cfg-msgWeight-val').textContent = state.msgWeight;
    engine.updateConfig(state); updateURL();
  });
  $('cfg-nickWeight').addEventListener('input', e => {
    state.nickWeight = parseInt(e.target.value,10)||800;
    $('cfg-nickWeight-val').textContent = state.nickWeight;
    engine.updateConfig(state); updateURL();
  });

  // Text inputs
  $('cfg-googleFont').addEventListener('input', e => { state.googleFont = e.target.value.trim(); engine.updateConfig(state); updateURL(); });
  $('cfg-fade').addEventListener('input', e => {
    const v = parseInt(e.target.value,10);
    state.fadeSeconds = isNaN(v)?0:v; state.fadeEnabled = state.fadeSeconds>0;
    engine.updateConfig(state); updateURL();
  });
  $('cfg-emoteScale').addEventListener('input', e => {
    state.emoteScale = parseFloat(e.target.value)||1;
    engine.updateConfig(state); updateURL();
  });

  // Color inputs
  $('cfg-fontColor').addEventListener('input', e => {
    const v = e.target.value.replace('#','');
    state.fontColor = /^[0-9a-fA-F]{6}$/.test(v)?'#'+v:'';
    if(state.fontColor) $('cfg-fontColorPick').value = state.fontColor;
    engine.updateConfig(state); updateURL();
  });
  $('cfg-fontColorPick').addEventListener('input', e => {
    const hex = e.target.value.replace('#','');
    $('cfg-fontColor').value = hex; state.fontColor = '#'+hex;
    engine.updateConfig(state); updateURL();
  });
  $('cfg-bgColor').addEventListener('input', e => {
    const v = e.target.value.replace('#','');
    state.bgColor = /^[0-9a-fA-F]{6}$/.test(v)?'#'+v:'';
    if(state.bgColor) $('cfg-bgColorPick').value = state.bgColor;
    applyPreviewBg(); updateURL();
  });
  $('cfg-bgColorPick').addEventListener('input', e => {
    const hex = e.target.value.replace('#','');
    $('cfg-bgColor').value = hex; state.bgColor = '#'+hex;
    applyPreviewBg(); updateURL();
  });

  // Blacklists
  $('cfg-userBL').addEventListener('input', e => { state.userBL=e.target.value.toLowerCase().split(',').map(s=>s.trim()).filter(Boolean); updateURL(); });
  $('cfg-botNames').addEventListener('input', e => { state.botNames=e.target.value.toLowerCase().split(',').map(s=>s.trim()).filter(Boolean); updateURL(); });
  $('cfg-prefixBL').addEventListener('input', e => { state.prefixBL=e.target.value.toLowerCase().split(',').map(s=>s.trim()).filter(Boolean); updateURL(); });

  function applyPreviewBg() {
    const frame = $('preview-frame');
    if (state.bgColor) {
      frame.classList.add('has-bg');
      frame.style.background = state.bgColor;
    } else {
      frame.classList.remove('has-bg');
      frame.style.background = '';
    }
  }

  /* ── URL Builder ── */
  function updateURL() {
    const p = new URLSearchParams();
    const ch = state.channel || 'KANAŁ';
    p.set('kick', ch);
    if (state.font !== 'opensans') p.set('font', state.font);
    if (state.googleFont) p.set('googleFont', state.googleFont);
    if (state.nickFont) p.set('nickFont', state.nickFont);
    if (state.nickGoogleFont) p.set('nickGoogleFont', state.nickGoogleFont);
    if (state.nickWeight !== 800) p.set('nickWeight', String(state.nickWeight));
    if (state.msgWeight !== 400) p.set('msgWeight', String(state.msgWeight));
    if (state.textSize !== 'small') p.set('textSize', state.textSize);
    if (state.fontSize) p.set('fontSize', state.fontSize);
    if (state.textShadow !== 'large') p.set('textShadow', state.textShadow);
    if (state.stroke !== 'none') p.set('stroke', state.stroke);
    if (state.sourceTag !== 'none') p.set('sourceTag', state.sourceTag);
    if (state.fontColor) p.set('fontColor', state.fontColor.replace('#',''));
    if (state.bgColor) p.set('bgColor', state.bgColor.replace('#',''));
    if (state.msgCaps) p.set('msgCaps','true');
    if (state.hideNames) p.set('hideNames','true');
    if (state.msgSlideIn) p.set('msgSlideIn','1');
    if (!state.showSystemMsgs) p.set('showSystemMsgs','false');
    if (state.fadeEnabled && state.fadeSeconds>0) p.set('fade', String(state.fadeSeconds));
    if (state.emoteScale!==1) p.set('emoteScale', String(state.emoteScale));
    if (state.userBL.length) p.set('userBL', state.userBL.join(','));
    if (state.botNames.length) p.set('botNames', state.botNames.join(','));
    if (state.prefixBL.length) p.set('prefixBL', state.prefixBL.join(','));

    const base = location.origin + location.pathname;
    $('url-output').value = `${base}?${p.toString()}`;
  }

  /* ── Copy ── */
  $('copy-btn').addEventListener('click', () => {
    const url = $('url-output').value;
    navigator.clipboard.writeText(url).then(() => {
      const btn = $('copy-btn');
      btn.textContent = 'Skopiowano!';
      btn.style.background = '#4fd1c5';
      setTimeout(() => { btn.textContent = 'Kopiuj'; btn.style.background = '#53FC18'; }, 1500);
    });
  });

  /* ── Connect ── */
  $('connect-btn').addEventListener('click', async () => {
    const ch = $('cfg-channel').value.trim();
    if (!ch) return;
    state.channel = ch;
    $('connect-btn').disabled = true;
    updateURL();
    await engine.connectToKick(ch, (status, detail) => {
      const el = $('status-text');
      if (status==='connecting') el.textContent = 'Łączenie z kanałem...';
      else if (status==='loading-emotes') el.textContent = 'Ładowanie emotek 7TV...';
      else if (status==='connected') { el.textContent = `Połączono z: ${ch}`; el.style.color='#53FC18'; $('connect-btn').disabled=false; $('connect-btn').textContent='Reconnect'; }
      else if (status==='error') { el.textContent = detail||'Błąd'; el.style.color='#ff4f4f'; $('connect-btn').disabled=false; }
    });
  });

  // Enter key on channel input
  $('cfg-channel').addEventListener('keydown', e => { if(e.key==='Enter') $('connect-btn').click(); });

  updateURL();
}

})();
</script>
</body>
</html>
